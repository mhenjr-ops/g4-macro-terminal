name: G4 Macro Forecast (Tue/Thu)

on:
  schedule:
    # Tuesday and Thursday at 10:00 UTC — ahead of the 12:30/13:30 UTC US data
    # window, so the pre-event calls publish BEFORE the prints they forecast.
    # Two runs a week keeps spend near $14/month at observed token usage.
    - cron: "0 10 * * 2,4"
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write           # needed to commit the regenerated brief

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SDK
        run: pip install --quiet anthropic

      - name: Build forecast
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/build_forecast.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/forecast.json data/ledger.json
          if git diff --staged --quiet; then
            echo "No change — nothing to commit."
          else
            git commit -m "Forecast $(date -u +%Y-%m-%d)"
            git push
          fi
