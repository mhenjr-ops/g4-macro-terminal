name: G4 Macro Forecast

on:
  schedule:
    # Monday 06:00 UTC — the ForexFactory feed runs Sunday→Friday and rolls over the
    # weekend, so Monday morning is the first moment the whole week is visible. Early
    # enough to publish before the EU (07:00–09:00 UTC) and US (12:30 UTC) windows.
    - cron: "0 6 * * 1"

  # Manual runs: use this ahead of a specific event — the day before NFP, CPI, or an
  # FOMC decision — to re-forecast with the evidence that has landed since Monday.
  workflow_dispatch:
    inputs:
      focus:
        description: 'Narrow to matching events, e.g. "Non-Farm" or "CPI" or "USD". Blank = whole week.'
        required: false
        type: string
      max_events:
        description: 'How many events to forecast (fewer = cheaper, more detail each).'
        required: false
        default: '6'
        type: string

permissions:
  contents: write

concurrency:
  group: g4-forecast
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SDK
        run: pip install --quiet anthropic

      - name: Build forecast
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FOCUS: ${{ inputs.focus }}
          MAX_EVENTS: ${{ inputs.max_events }}
        run: python scripts/build_forecast.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/forecast.json data/ledger.json
          if git diff --staged --quiet; then
            echo "No change."
          else
            git commit -m "Forecast $(date -u +%Y-%m-%d)${FOCUS:+ (focus: $FOCUS)}"
            git push
          fi
        env:
          FOCUS: ${{ inputs.focus }}
