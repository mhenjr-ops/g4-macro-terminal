name: Daily G4 Macro Brief

on:
  schedule:
    # 11:30 UTC on weekdays ≈ 07:30 ET. ECB publishes reference rates on TARGET
    # business days only, so weekends would just rebuild Friday's numbers.
    - cron: "30 11 * * 1-5"
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write           # needed to commit the regenerated brief

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SDK
        run: pip install --quiet anthropic

      - name: Build brief
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/build_brief.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/brief.json
          if git diff --staged --quiet; then
            echo "No change in brief — nothing to commit."
          else
            git commit -m "Daily brief $(date -u +%Y-%m-%d)"
            git push
          fi
